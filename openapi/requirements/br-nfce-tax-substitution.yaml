            **SEFAZ rejections, returned later by the issue job.** GOBL doesn''t check these. Source: [MOC 7.0 Annex I](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=).


            | MOC rule | Rejection | Check |

            |---|---|---|

            | `B09-10, B09-40` | `703, 704` | Issue date and time within 5 minutes of SEFAZ receipt |

            | `B26-10` | `244` | Series `0` to `889` |

            | `I05-10, I05-20` | `777, 778` | NCM present and in the official table |

            | `I03-10, I03-30` | `611, 883` | GTIN with a valid check digit, or `SEM GTIN` |

            | `I08-150` | `725` | CFOP only `5101`-`5104`, `5115`, `5405`, `5656`, `5667` or `5933` |

            | `N12-40, N12a-40` | `382, 386` | CST or CSOSN paired with the CFOP |

            | `O01-10` | `742` | No IPI on an NFC-e |

            | `W16-40` | `750` | Above R$10,000, the consumer is identified |

            | `YA02-40, YA02-50` | `899, 436` | Payment means `90` and `99` refused |

            | `N12-30` | `766` | CST only `00`, `20`, `40`, `41` or `60`. `90` is a state option |

            | `YA04-10` | `391` | A card payment needs the card group |'
          content:
            application/json:
              schema:
                type: object
                description: GOBL faults.
                properties:
                  key:
                    type: string
                    description: Always `validation`.
                  faults:
                    type: array
                    description: One entry per failed rule.
                    items:
                      type: object
                      description: A fault.
                      properties:
                        code:
                          type: string
                          description: The GOBL rule code.
                        paths:
                          type: array
                          description: JSON paths of the fields.
                          items:
                            type: string
                        message:
                          type: string
                          description: Human-readable message.
              examples:
                internet-sale:
                  summary: Presence 2, an internet sale
                  value:
                    key: validation
                    faults:
                    - code: GOBL-BR-NFE-BILL-INVOICE-28
                      paths:
                      - $.tax.ext
                      message: NFC-e invoices require in-person or delivery for 'br-nfe-presence'
                missing-cfop:
                  summary: A line without CFOP
                  value:
                    key: validation
                    faults:
                    - code: GOBL-BR-NFE-BILL-INVOICE-35
                      paths:
                      - $.lines[0].ext
                      message: invoice lines require 'br-nfe-cfop' extension
                ncm-with-dots:
                  summary: NCM written with dots
                  value:
                    key: validation
                    faults:
                    - code: GOBL-BR-NFE-ORG-IDENTITY-02
                      paths:
                      - $.lines[0].item.identities[0].code
                      message: NCM identity code must be an 8-digit number (or 2 digits in exceptional cases), without separators
                missing-supplier-state:
                  summary: Supplier address without state
                  value:
                    key: validation
                    faults:
                    - code: GOBL-BR-NFE-BILL-INVOICE-07
                      paths:
                      - $.supplier.addresses[0].state
                      message: invoice supplier address requires a state
                missing-ibge:
                  summary: Supplier without IBGE code
                  value:
                    key: validation
                    faults:
                    - code: GOBL-BR-NFE-BILL-INVOICE-09
                      paths:
                      - $.supplier.ext
                      message: invoice supplier requires 'br-ibge-municipality' extension when addresses are present
                cst60-with-rate:
                  summary: CST 60 with an ICMS rate
                  value:
                    key: validation
                    faults:
                    - code: GOBL-BR-NFE-TAX-COMBO-07
                      paths:
                      - $.lines[1].taxes[0].percent
                      message: 'ICMS percent must be zero for CST codes 40, 41, 50 and 60: they carry no ICMS value'
components:
  securitySchemes:
    authToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use a sandbox workspace token.
