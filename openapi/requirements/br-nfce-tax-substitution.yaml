openapi: 3.0.3
info:
  title: 'NFC-e requirements: Tax substitution'
  version: spike
  description: Generated by scripts/requirements/gen_br_nfce.py. Do not edit by hand.
servers:
- url: https://api.invopop.com
  description: production
security:
- authToken: []
paths:
  /silo/v1/gobl/build:
    post:
      summary: Tax substitution
      description: 'A line already taxed by substitution (ICMS-ST), next to a resale line. Required means required for this scenario: by GOBL at upload, or by SEFAZ at authorization. Each field says who checks it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Build request.
              properties:
                data:
                  type: object
                  description: A GOBL invoice for an NFC-e, model 65. Fields not listed follow the [GOBL invoice schema](https://docs.gobl.org/draft-0/bill/invoice).
                  properties:
                    $schema:
                      type: string
                      description: GOBL schema.
                      enum:
                      - https://gobl.org/draft-0/bill/invoice
                    $addons:
                      type: array
                      description: Must include `br-nfe-v4`.
                      items:
                        type: string
                        enum:
                        - br-nfe-v4
                      minItems: 1
                    $tags:
                      type: array
                      description: '`simplified` sets model `65`, NFC-e. Without it, the document is an NF-e.'
                      items:
                        type: string
                        enum:
                        - simplified
                      minItems: 1
                    series:
                      type: string
                      description: 'Series. GOBL accepts `0` to `999`.


                        NF-e XML: `serie`.


                        Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-23`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-INVOICE-24`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).


                        Checked by SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `B26-10`, rejection `244`.'
                      example: '1'
                    code:
                      type: string
                      description: 'Receipt number. The workflow''s sequence step fills it when left out.


                        NF-e XML: `nNF`.'
                    issue_date:
                      type: string
                      description: 'Sale date. GOBL fills the upload date.


                        NF-e XML: `dhEmi`.


                        Checked by SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `B09-10`, rejection `703`.'
                    tax:
                      type: object
                      description: Document-level extensions.
                      properties:
                        ext:
                          type: object
                          description: Tax extensions.
                          properties:
                            br-nfe-presence:
                              type: string
                              description: '`1`, in person.


                                NF-e XML: `indPres`.


                                Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-26`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-INVOICE-28`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              enum:
                              - '1'
                          required:
                          - br-nfe-presence
                      required:
                      - ext
                    supplier:
                      type: object
                      description: The establishment issuing the receipt. One registered supplier per establishment.
                      properties:
                        name:
                          type: string
                          description: 'Legal name.


                            NF-e XML: `xNome`.


                            Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-10`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                        tax_id:
                          type: object
                          description: Tax ID.
                          properties:
                            country:
                              type: string
                              description: Always `BR`.
                              enum:
                              - BR
                            code:
                              type: string
                              description: 'CNPJ, 14 digits.


                                NF-e XML: `CNPJ`.


                                Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-01`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-INVOICE-02`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              example: '48219376000118'
                          required:
                          - country
                          - code
                        identities:
                          type: array
                          description: 'The state registration (IE), key `br-nfe-state-reg`. GOBL accepts the document without it. SEFAZ needs it.


                            NF-e XML: `IE`.'
                          items:
                            type: object
                            description: An identity.
                            properties:
                              key:
                                type: string
                                description: Identity type.
                                enum:
                                - br-nfe-state-reg
                              code:
                                type: string
                                description: IE number.
                                example: '110042490114'
                            required:
                            - key
                            - code
                          minItems: 1
                        addresses:
                          type: array
                          description: 'At least one address. Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-03`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-INVOICE-04`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-INVOICE-08`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-INVOICE-11`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                          items:
                            type: object
                            description: The establishment's address.
                            properties:
                              street:
                                type: string
                                description: 'Street name.


                                  NF-e XML: `xLgr`.'
                              num:
                                type: string
                                description: 'Street number.


                                  NF-e XML: `nro`.'
                              locality:
                                type: string
                                description: 'Neighbourhood (_bairro_).


                                  NF-e XML: `xBairro`.'
                              state:
                                type: string
                                description: 'Two-letter state code.


                                  NF-e XML: `UF`.'
                                example: SP
                              code:
                                type: string
                                description: 'Postal code (CEP).


                                  NF-e XML: `CEP`.'
                                example: 01426-001
                              country:
                                type: string
                                description: ISO country code. GOBL fills it from the tax ID.
                                default: BR
                            required:
                            - street
                            - num
                            - locality
                            - state
                            - code
                          minItems: 1
                        ext:
                          type: object
                          description: Supplier extensions.
                          properties:
                            br-ibge-municipality:
                              type: string
                              description: '7-digit IBGE municipality code.


                                NF-e XML: `cMun`.


                                Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-09`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              example: '3550308'
                            br-nfe-regime:
                              type: string
                              description: 'Tax regime. `3` normal. It decides CST or CSOSN on every line.


                                NF-e XML: `CRT`.


                                Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-39`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-INVOICE-42`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              default: '3'
                              enum:
                              - '2'
                              - '3'
                          required:
                          - br-ibge-municipality
                      required:
                      - name
                      - tax_id
                      - identities
                      - addresses
                      - ext
                    lines:
                      type: array
                      description: At least one line.
                      items:
                        type: object
                        description: One line per product. A line taxed by substitution (ICMS-ST) uses CFOP `5405`, CST `60` and ICMS `0%`.
                        properties:
                          quantity:
                            type: string
                            description: 'Quantity.


                              NF-e XML: `qCom`.'
                            example: '1'
                          item:
                            type: object
                            description: The product.
                            properties:
                              name:
                                type: string
                                description: 'Product name.


                                  NF-e XML: `xProd`.'
                              price:
                                type: string
                                description: 'Unit price paid by the consumer, taxes included.


                                  NF-e XML: `vUnCom`.'
                                example: '899.90'
                              identities:
                                type: array
                                description: 'Product codes. `ncm`: the 8-digit NCM code, no dots. Checked by GOBL: [`GOBL-BR-NFE-ORG-IDENTITY-02`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules). Checked by SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `I05-10`, rejection `777`. `gtin`: the barcode, when the product has one.'
                                items:
                                  type: object
                                  description: A product code.
                                  properties:
                                    key:
                                      type: string
                                      description: Code type.
                                      enum:
                                      - ncm
                                      - gtin
                                    code:
                                      type: string
                                      description: 'The code.


                                        NF-e XML: `NCM, cEAN`.'
                                      example: '64041100'
                                  required:
                                  - key
                                  - code
                                minItems: 1
                            required:
                            - name
                            - price
                            - identities
                          taxes:
                            type: array
                            description: ICMS, PIS and COFINS.
                            items:
                              type: object
                              description: 'One entry per category: ICMS, PIS and COFINS. Checked by GOBL: [`GOBL-BR-NFE-BILL-LINE-01`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-LINE-02`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-LINE-03`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              properties:
                                cat:
                                  type: string
                                  description: Tax category.
                                  enum:
                                  - ICMS
                                  - PIS
                                  - COFINS
                                percent:
                                  type: string
                                  description: '`0%` on the ICMS entry with CST `60`. Checked by GOBL: [`GOBL-BR-NFE-TAX-COMBO-07`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                                  example: 18%
                                ext:
                                  type: object
                                  description: Tax codes. GOBL fills the normal-regime defaults when you leave them out.
                                  properties:
                                    br-nfe-icms-cst:
                                      type: string
                                      description: 'ICMS CST, normal regime.


                                        NF-e XML: `CST`.


                                        Checked by GOBL: [`GOBL-BR-NFE-TAX-COMBO-01`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).


                                        Checked by SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `N12-30`, rejection `766`.'
                                      default: '00'
                                      enum:
                                      - '00'
                                      - '20'
                                      - '40'
                                      - '41'
                                      - '60'
                                    br-nfe-icms-origin:
                                      type: string
                                      description: 'Goods origin. `0` national, `1` direct import, `2` foreign bought in Brazil.


                                        NF-e XML: `orig`.


                                        Checked by GOBL: [`GOBL-BR-NFE-TAX-COMBO-02`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                                      default: '0'
                                    br-nfe-pis-cst:
                                      type: string
                                      description: PIS CST.
                                      default: '01'
                                    br-nfe-cofins-cst:
                                      type: string
                                      description: COFINS CST.
                                      default: '01'
                              required:
                              - cat
                              - percent
                            minItems: 3
                          ext:
                            type: object
                            description: Line extensions.
                            properties:
                              br-nfe-cfop:
                                type: string
                                description: 'CFOP of the operation. `5102` resells goods bought from third parties.


                                  NF-e XML: `CFOP`.


                                  Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-35`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).


                                  Checked by SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `I08-150`, rejection `725`.'
                                enum:
                                - '5101'
                                - '5102'
                                - '5103'
                                - '5104'
                                - '5115'
                                - '5405'
                                - '5656'
                                - '5667'
                                - '5933'
                                example: '5102'
                            required:
                            - br-nfe-cfop
                        required:
                        - quantity
                        - item
                        - taxes
                        - ext
                      minItems: 1
                    payment:
                      type: object
                      description: 'How the consumer pays: `instructions` when nothing is recorded as paid. Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-31`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-INVOICE-32`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                      properties:
                        instructions:
                          type: object
                          description: One payment means.
                          properties:
                            key:
                              type: string
                              description: '`cash` gives `01`, `card` gives `03`, `card+debit` gives `04`. Use `other` with the extension for any other means.'
                              example: card
                            ext:
                              type: object
                              description: Payment extensions.
                              properties:
                                br-nfe-payment-means:
                                  type: string
                                  description: 'Payment means code. GOBL fills it from the key, except `other`.


                                    NF-e XML: `tPag`.


                                    Checked by SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `YA02-40`, rejection `899`, [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `YA02-50`, rejection `436`.'
                          required:
                          - key
                      required:
                      - instructions
                    notes:
                      type: array
                      description: 'A note with key `reason`: the nature of the operation, 1 to 60 characters. Checked by GOBL: [`GOBL-BR-NFE-BILL-INVOICE-29`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`GOBL-BR-NFE-BILL-INVOICE-30`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                      items:
                        type: object
                        description: A note.
                        properties:
                          key:
                            type: string
                            description: Note key.
                            enum:
                            - reason
                          text:
                            type: string
                            description: 'Nature of the operation.


                              NF-e XML: `natOp`.'
                            example: Venda de mercadoria
                        required:
                        - key
                        - text
                      minItems: 1
                  required:
                  - $schema
                  - $addons
                  - $tags
                  - series
                  - tax
                  - supplier
                  - lines
                  - payment
                  - notes
                envelop:
                  type: boolean
                  description: When true, returns a full GOBL envelope.
                  default: false
              required:
              - data
            examples:
              tax-substitution:
                summary: Tax substitution
                value:
                  data:
                    $schema: https://gobl.org/draft-0/bill/invoice
                    $addons:
                    - br-nfe-v4
                    $tags:
                    - simplified
                    series: '1'
                    tax:
                      ext:
                        br-nfe-presence: '1'
                    supplier:
                      name: Loja Teste Esportes Ltda.
                      tax_id:
                        country: BR
                        code: '48219376000118'
                      identities:
                      - key: br-nfe-state-reg
                        code: '110042490114'
                      addresses:
                      - num: '1500'
                        street: Rua Oscar Freire
                        locality: Jardins
                        state: SP
                        code: 01426-001
                      ext:
                        br-ibge-municipality: '3550308'
                    lines:
                    - quantity: '1'
                      item:
                        name: Tênis esportivo masculino
                        price: '899.90'
                        identities:
                        - key: ncm
                          code: '64041100'
                      taxes:
                      - cat: ICMS
                        percent: 18%
                      - cat: PIS
                        percent: 1.65%
                      - cat: COFINS
                        percent: 7.60%
                      ext:
                        br-nfe-cfop: '5102'
                    - quantity: '2'
                      item:
                        name: Isotônico 500ml
                        price: '6.00'
                        identities:
                        - key: ncm
                          code: '22029900'
                      taxes:
                      - cat: ICMS
                        percent: 0%
                        ext:
                          br-nfe-icms-cst: '60'
                      - cat: PIS
                        percent: 1.65%
                      - cat: COFINS
                        percent: 7.60%
                      ext:
                        br-nfe-cfop: '5405'
                    payment:
                      instructions:
                        key: card
                    notes:
                    - key: reason
                      text: Venda de mercadoria
      responses:
        '422':
          description: 'GOBL faults returned by this call. Each example in the menu is a real response to a broken copy of this scenario.


            **All GOBL `br-nfe-v4` faults that apply to an NFC-e.** Full codes start with `GOBL-BR-NFE-`.


            | Code | Field | Message |

            |---|---|---|

            | [`BILL-INVOICE-34`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `invoice` | Invoice currency must be BRL or provide exchange rate for conversion |

            | [`BILL-INVOICE-30`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `invoice` | Invoice requires a note with key ''reason'' to describe the nature of the operation (natOp) |

            | [`BILL-INVOICE-01`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.tax_id` | Invoice supplier tax ID is required |

            | [`BILL-INVOICE-02`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.tax_id.code` | Invoice supplier tax ID code is required |

            | [`BILL-INVOICE-03`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.addresses[*]` | Invoice supplier address must not be empty |

            | [`BILL-INVOICE-04`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.addresses[*].street` | Invoice supplier address requires a street |

            | [`BILL-INVOICE-05`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.addresses[*].num` | Invoice supplier address requires a number |

            | [`BILL-INVOICE-06`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.addresses[*].locality` | Invoice supplier address requires a locality |

            | [`BILL-INVOICE-07`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.addresses[*].state` | Invoice supplier address requires a state |

            | [`BILL-INVOICE-08`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.addresses[*].code` | Invoice supplier address requires a postal code |

            | [`BILL-INVOICE-37`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.addresses[*].country` | Invoice supplier address requires a country |

            | [`BILL-INVOICE-09`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.ext` | Invoice supplier requires ''br-ibge-municipality'' extension when addresses are present |

            | [`BILL-INVOICE-39`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.ext` | Invoice supplier requires ''br-nfe-regime'' extension |

            | [`BILL-INVOICE-10`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.name` | Invoice supplier name is required |

            | [`BILL-INVOICE-11`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `supplier.addresses` | Invoice supplier must have at least one address |

            | [`BILL-INVOICE-36`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer` | Invoice customer must have a tax ID or a foreign country identity |

            | [`BILL-INVOICE-15`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.tax_id.code` | Invoice customer tax ID code is required |

            | [`BILL-INVOICE-16`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.addresses[*]` | Invoice customer address must not be empty |

            | [`BILL-INVOICE-17`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.addresses[*].street` | Invoice customer address requires a street |

            | [`BILL-INVOICE-18`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.addresses[*].num` | Invoice customer address requires a number |

            | [`BILL-INVOICE-19`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.addresses[*].locality` | Invoice customer address requires a locality |

            | [`BILL-INVOICE-21`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.addresses[*].code` | Invoice customer address requires a postal code |

            | [`BILL-INVOICE-38`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.addresses[*].country` | Invoice customer address requires a country |

            | [`BILL-INVOICE-20`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.addresses[*].state` | Invoice customer address requires a state |

            | [`BILL-INVOICE-22`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.ext` | Invoice customer requires ''br-ibge-municipality'' extension when addresses are present |

            | [`BILL-INVOICE-50`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.ext` | Invoice customer requires ''br-nfe-state-reg-ind'' extension |

            | [`BILL-INVOICE-51`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer` | Invoice customer requires ''br-nfe-state-reg'' identity when ''br-nfe-state-reg-ind'' is ''1'' |

            | [`BILL-INVOICE-52`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer` | Invoice customer must not have ''br-nfe-state-reg'' identity when ''br-nfe-state-reg-ind'' is ''2'' |

            | [`BILL-INVOICE-53`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `customer.ext` | NFC-e invoices require ''9'' for ''br-nfe-state-reg-ind'' |

            | [`BILL-INVOICE-23`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `series` | Invoice series is required |

            | [`BILL-INVOICE-24`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `series` | Invoice series format is invalid; must be 0 or 1-999 |

            | [`BILL-INVOICE-25`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `tax` | Invoice tax is required |

            | [`BILL-INVOICE-26`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `tax.ext` | Invoice tax requires ''br-nfe-model'', ''br-nfe-presence'', ''br-nfe-purpose'' and ''br-nfe-operation-type'' extensions |

            | [`BILL-INVOICE-44`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `tax.ext` | ''br-nfe-model'' extension, when set, must be a valid code |

            | [`BILL-INVOICE-45`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `tax.ext` | ''br-nfe-presence'' extension, when set, must be a valid code |

            | [`BILL-INVOICE-46`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `tax.ext` | ''br-nfe-purpose'' extension, when set, must be a valid code |

            | [`BILL-INVOICE-47`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `tax.ext` | ''br-nfe-operation-type'' extension, when set, must be a valid code |

            | [`BILL-INVOICE-28`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules) | `tax.ext` | NFC-e invoices require in-person or delivery for ''br-nfe-presence'' |

