                    lines:
                    - quantity: '1'
                      item:
                        name: Tênis esportivo masculino
                        price: '899.90'
                        identities:
                        - key: ncm
                          code: '64041100'
                      taxes:
                      - cat: ICMS
                        percent: 18%
                      - cat: PIS
                        percent: 1.65%
                      - cat: COFINS
                        percent: 7.60%
                      ext:
