openapi: 3.0.3
info:
  title: NFC-e requirements
  version: spike
  description: Generated by scripts/requirements/gen_br_nfce.py. Do not edit by hand.
servers:
- url: https://api.invopop.com
  description: production
security:
- authToken: []
paths:
  /silo/v1/gobl/build:
    post:
      summary: NFC-e requirements
      description: 'Every field an NFC-e needs, with who checks it: GOBL at upload, or SEFAZ at authorization. Pick a scenario example and send it to the build endpoint with a sandbox API key. It returns the built document, or the GOBL faults.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  description: A GOBL invoice for an NFC-e, model 65. Fields not listed follow the [GOBL invoice schema](https://docs.gobl.org/draft-0/bill/invoice).
                  properties:
                    $schema:
                      type: string
                      description: GOBL schema.
                      enum:
                      - https://gobl.org/draft-0/bill/invoice
                    $addons:
                      type: array
                      items:
                        type: string
                        enum:
                        - br-nfe-v4
                      description: Must include `br-nfe-v4`.
                    $tags:
                      type: array
                      items:
                        type: string
                        enum:
                        - simplified
                      description: '`simplified` sets model `65`, NFC-e. Without it, the document is an NF-e.'
                    series:
                      type: string
                      description: 'Series. GOBL accepts `0` to `999`, SEFAZ up to `889`.


                        NF-e XML: `serie`.


                        GOBL: [`INVOICE-23`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-24`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).


                        SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `B26-10`, rejection `244`.'
                      example: '1'
                    code:
                      type: string
                      description: 'Receipt number. The workflow''s sequence step fills it when left out.


                        NF-e XML: `nNF`.'
                    issue_date:
                      type: string
                      description: 'Sale date. GOBL fills the upload date. SEFAZ wants the issue time within 5 minutes of receipt.


                        NF-e XML: `dhEmi`.


                        SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `B09-10`, rejection `703`.'
                    tax:
                      type: object
                      description: Document-level extensions.
                      properties:
                        ext:
                          type: object
                          description: ''
                          properties:
                            br-nfe-presence:
                              type: string
                              description: '`1` in person, `4` home delivery.


                                NF-e XML: `indPres`.


                                GOBL: [`INVOICE-26`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-28`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              enum:
                              - '1'
                              - '4'
                          required:
                          - br-nfe-presence
                      required:
                      - ext
                    supplier:
                      type: object
                      description: The establishment issuing the receipt. One registered supplier per establishment.
                      properties:
                        name:
                          type: string
                          description: 'Legal name.


                            NF-e XML: `xNome`.


                            GOBL: [`INVOICE-10`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                        tax_id:
                          type: object
                          description: Tax ID.
                          properties:
                            country:
                              type: string
                              description: Always `BR`.
                              example: BR
                            code:
                              type: string
                              description: 'CNPJ, 14 digits.


                                NF-e XML: `CNPJ`.


                                GOBL: [`INVOICE-01`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-02`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              example: '48219376000118'
                          required:
                          - country
                          - code
                        identities:
                          type: array
                          description: 'Add the state registration (IE) with key `br-nfe-state-reg`. GOBL accepts the document without it. SEFAZ needs it.


                            NF-e XML: `IE`.'
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                enum:
                                - br-nfe-state-reg
                              code:
                                type: string
                                example: '110042490114'
                        addresses:
                          type: array
                          description: 'At least one address. GOBL: [`INVOICE-03`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-11`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                          items: &id001
                            type: object
                            description: The establishment's address.
                            properties:
                              street:
                                type: string
                                description: 'Street name.


                                  NF-e XML: `xLgr`.


                                  GOBL: [`INVOICE-04`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              num:
                                type: string
                                description: 'Street number.


                                  NF-e XML: `nro`.


                                  GOBL: [`INVOICE-05`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              locality:
                                type: string
                                description: 'Neighbourhood (_bairro_).


                                  NF-e XML: `xBairro`.


                                  GOBL: [`INVOICE-06`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              state:
                                type: string
                                description: 'Two-letter state code.


                                  NF-e XML: `UF`.


                                  GOBL: [`INVOICE-07`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                                example: SP
                              code:
                                type: string
                                description: 'Postal code (CEP).


                                  NF-e XML: `CEP`.


                                  GOBL: [`INVOICE-08`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                                example: 01426-001
                              country:
                                type: string
                                description: ISO country code. GOBL fills it from the tax ID.
                                default: BR
                            required:
                            - street
                            - num
                            - locality
                            - state
                            - code
                          minItems: 1
                        ext:
                          type: object
                          description: Supplier extensions.
                          properties:
                            br-ibge-municipality:
                              type: string
                              description: '7-digit IBGE municipality code.


                                NF-e XML: `cMun`.


                                GOBL: [`INVOICE-09`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              example: '3550308'
                            br-nfe-regime:
                              type: string
                              description: 'Tax regime: `1` Simples Nacional, `2` Simples Nacional excess, `3` normal, `4` MEI. It decides CST or CSOSN on every line.


                                NF-e XML: `CRT`.


                                GOBL: [`INVOICE-39`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-42`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-43`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              default: '3'
                              enum:
                              - '1'
                              - '2'
                              - '3'
                              - '4'
                          required:
                          - br-ibge-municipality
                      required:
                      - name
                      - tax_id
                      - addresses
                      - ext
                    customer:
                      type: object
                      description: 'Optional on an NFC-e. Send it to print the consumer''s CPF. SEFAZ requires it above R$10,000 and with home delivery.


                        SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `W16-40`, rejection `750`. SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `E01-20`, rejection `787`.'
                      properties:
                        name:
                          type: string
                          description: 'The consumer''s name.


                            NF-e XML: `xNome`.'
                        tax_id:
                          type: object
                          description: 'The consumer''s CPF. GOBL: [`INVOICE-36`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                          properties:
                            country:
                              type: string
                              description: Always `BR`.
                              example: BR
                            code:
                              type: string
                              description: 'CPF, 11 digits.


                                NF-e XML: `CPF`.


                                GOBL: [`INVOICE-15`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              example: '39851726419'
                        addresses:
                          type: array
                          description: 'The delivery address. Needed with presence `4`. SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `E05-20`, rejection `788`. When sent, GOBL: [`INVOICE-16`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-17`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-21`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                          items: *id001
                        ext:
                          type: object
                          description: Customer extensions.
                          properties:
                            br-ibge-municipality:
                              type: string
                              description: 'IBGE code of the customer''s city. Required when an address is sent.


                                GOBL: [`INVOICE-22`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              example: '3550308'
                            br-nfe-state-reg-ind:
                              type: string
                              description: 'Always `9`, non-taxpayer, on an NFC-e.


                                NF-e XML: `indIEDest`.


                                GOBL: [`INVOICE-53`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              default: '9'
                              enum:
                              - '9'
                    lines:
                      type: array
                      items:
                        type: object
                        description: One line per product.
                        properties:
                          quantity:
                            type: string
                            description: 'Quantity.


                              NF-e XML: `qCom`.'
                            example: '1'
                          item:
                            type: object
                            description: The product.
                            properties:
                              name:
                                type: string
                                description: 'Product name.


                                  NF-e XML: `xProd`.'
                              price:
                                type: string
                                description: 'Unit price paid by the consumer, taxes included.


                                  NF-e XML: `vUnCom`.'
                                example: '899.90'
                              identities:
                                type: array
                                description: '`ncm`: 8-digit NCM code, no dots. GOBL checks the format. GOBL: [`ORG-IDENTITY-02`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules). SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `I05-10`, rejection `777`.


                                  `gtin`: the barcode, when the product has one. SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `I03-10`, rejection `611`.'
                                items:
                                  type: object
                                  properties:
                                    key:
                                      type: string
                                      enum:
                                      - ncm
                                      - gtin
                                    code:
                                      type: string
                                      example: '64041100'
                            required:
                            - name
                            - price
                          taxes:
                            type: array
                            items:
                              type: object
                              description: 'One tax per category: ICMS, PIS and COFINS on every line. GOBL: [`LINE-01`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`LINE-02`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`LINE-03`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                              properties:
                                cat:
                                  type: string
                                  description: Tax category.
                                  enum:
                                  - ICMS
                                  - PIS
                                  - COFINS
                                percent:
                                  type: string
                                  description: 'Rate set by the tax advisor. `0%` for ICMS CST `40`, `41`, `60` and every NFC-e CSOSN.


                                    GOBL: [`TAX-COMBO-06`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`TAX-COMBO-07`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                                  example: 18%
                                ext:
                                  type: object
                                  description: Tax codes. GOBL fills the normal-regime defaults.
                                  properties:
                                    br-nfe-icms-cst:
                                      type: string
                                      description: 'ICMS CST, normal regime. NFC-e accepts `00`, `20`, `40`, `41`, `60`. `90` is a state option.


                                        NF-e XML: `CST`.


                                        GOBL: [`TAX-COMBO-01`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).


                                        SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `N12-30`, rejection `766`.'
                                      default: '00'
                                    br-nfe-icms-csosn:
                                      type: string
                                      description: 'ICMS CSOSN, Simples Nacional. NFC-e accepts `102`, `103`, `300`, `400`, `500`. `900` is a state option.


                                        NF-e XML: `CSOSN`.


                                        GOBL: [`INVOICE-43`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).


                                        SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `N12a-20`, rejection `383`.'
                                    br-nfe-icms-origin:
                                      type: string
                                      description: 'Goods origin. `0` national, `1` direct import, `2` foreign bought in Brazil.


                                        NF-e XML: `orig`.


                                        GOBL: [`TAX-COMBO-02`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                                      default: '0'
                                    br-nfe-pis-cst:
                                      type: string
                                      description: 'PIS CST.


                                        GOBL: [`TAX-COMBO-03`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                                      default: '01'
                                    br-nfe-cofins-cst:
                                      type: string
                                      description: 'COFINS CST.


                                        GOBL: [`TAX-COMBO-04`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                                      default: '01'
                              required:
                              - cat
                              - percent
                            description: ICMS, PIS and COFINS.
                          ext:
                            type: object
                            description: Line extensions.
                            properties:
                              br-nfe-cfop:
                                type: string
                                description: 'CFOP. NFC-e accepts `5101`-`5104`, `5115`, `5405`, `5656`, `5667`, `5933`. CST `60` and CSOSN `500` go with `5405`.


                                  NF-e XML: `CFOP`.


                                  GOBL: [`INVOICE-35`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).


                                  SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `I08-150`, rejection `725`.'
                                example: '5102'
                            required:
                            - br-nfe-cfop
                        required:
                        - quantity
                        - item
                        - taxes
                        - ext
                      minItems: 1
                      description: At least one line.
                    payment:
                      type: object
                      description: 'How the consumer pays. Instructions when nothing is recorded as paid, advances for what is paid. GOBL: [`INVOICE-31`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-32`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                      properties:
                        instructions:
                          type: object
                          description: One payment means.
                          properties:
                            key:
                              type: string
                              description: '`cash` gives `01`, `card` gives `03`, `card+debit` gives `04`. Use `other` with the extension for any other means.'
                              example: card
                            ext:
                              type: object
                              description: Payment extensions.
                              properties:
                                br-nfe-payment-means:
                                  type: string
                                  description: 'Payment means code. NFC-e refuses `90` and `99`.


                                    NF-e XML: `tPag`.


                                    SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `YA02-40`, rejection `899`.


                                    SEFAZ: [MOC](https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=J%20I%20v4eN00E=) rule `YA02-50`, rejection `436`.'
                          required:
                          - key
                        advances:
                          type: array
                          description: 'One entry per tender. Their sum can''t exceed the total. GOBL: [`INVOICE-33`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`PAY-RECORD-01`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                          items:
                            type: object
                            properties:
                              description:
                                type: string
                              amount:
                                type: string
                                example: '400.00'
                              key:
                                type: string
                                example: cash
                    notes:
                      type: array
                      description: 'A note with key `reason`: the nature of the operation, 1 to 60 characters. GOBL: [`INVOICE-29`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules), [`INVOICE-30`](https://docs.gobl.org/addons/br-nfe-v4#validation-rules).'
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            enum:
                            - reason
                          text:
                            type: string
                            example: Venda de mercadoria
                  required:
                  - $schema
                  - $addons
                  - $tags
                  - series
                  - tax
                  - supplier
                  - lines
                  - notes
                envelop:
                  type: boolean
                  description: When true, returns a full GOBL envelope.
                  default: false
            examples:
              in-person-sale:
                summary: In-person sale
                value:
                  data:
                    $schema: https://gobl.org/draft-0/bill/invoice
                    $addons:
                    - br-nfe-v4
                    $tags:
                    - simplified
                    series: '1'
                    tax:
                      ext:
                        br-nfe-presence: '1'
                    supplier:
                      name: Loja Teste Esportes Ltda.
                      tax_id:
                        country: BR
                        code: '48219376000118'
                      identities:
                      - key: br-nfe-state-reg
                        code: '110042490114'
                      addresses:
                      - num: '1500'
                        street: Rua Oscar Freire
                        locality: Jardins
                        state: SP
                        code: 01426-001
                      ext:
                        br-ibge-municipality: '3550308'
                    lines:
                    - quantity: '1'
                      item:
                        name: Tênis esportivo masculino
                        price: '899.90'
                        identities:
                        - key: ncm
                          code: '64041100'
                      taxes:
                      - cat: ICMS
                        percent: 18%
                      - cat: PIS
                        percent: 1.65%
                      - cat: COFINS
                        percent: 7.60%
                      ext:
                        br-nfe-cfop: '5102'
                    payment:
                      instructions:
                        key: card
                    notes:
                    - key: reason
                      text: Venda de mercadoria
              identified-consumer:
                summary: Identified consumer, split tender
                value:
                  data:
                    $schema: https://gobl.org/draft-0/bill/invoice
                    $addons:
                    - br-nfe-v4
                    $tags:
                    - simplified
                    series: '1'
                    tax:
