                    $schema: https://gobl.org/draft-0/bill/invoice
                    $addons:
                    - br-nfe-v4
                    $tags:
                    - simplified
                    series: '1'
                    tax:
                      ext:
                        br-nfe-presence: '1'
                    supplier:
                      name: Loja Teste Esportes Ltda.
                      tax_id:
                        country: BR
                        code: '48219376000118'
                      identities:
                      - key: br-nfe-state-reg
                        code: '110042490114'
