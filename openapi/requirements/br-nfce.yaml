              home-delivery:
                summary: Home delivery
                value:
                  data:
                    $schema: https://gobl.org/draft-0/bill/invoice
                    $addons:
                    - br-nfe-v4
                    $tags:
                    - simplified
                    series: '1'
                    tax:
                      ext:
                        br-nfe-presence: '4'
                    supplier:
                      name: Loja Teste Esportes Ltda.
                      tax_id:
