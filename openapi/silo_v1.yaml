  /silo/v1/entries/query:
    get:
      description: |
        Search the documents of one GOBL type using a filter expression.

        Unlike the other entry endpoints, this reads an indexed copy of your
        documents rather than the documents themselves, which is what makes
        filtering and sorting on document fields possible. Two consequences are
        worth knowing:

        - Results are eventually consistent. A document created a moment ago may
          not appear yet. Each response carries a "watermark" giving the time of
          the most recent change reflected in it.
        - The fields you may filter and sort on depend on the document type. They
          are listed in full under "Fields" below.

        Set "schema" to the document type to search: `bill/delivery`, `bill/invoice`, `bill/order`, `bill/payment`, `bill/status`, `note/message`, `org/item`, `org/party`.

        Filter terms are combined with AND. OR is accepted only between values of
        a single field, which is how a set membership test is written. For
        free-text searching across documents, use the search endpoint instead.

        "AND" and "OR" are keywords and must be written in capitals; "and", "&&"
        and "||" are not accepted. The whole filter must be URL-encoded, because
        an unencoded "&" ends the parameter and the rest of the filter would be
        silently dropped — a request carrying the leftovers is rejected rather
        than answered with a wider result set than was asked for.

        For example, invoices for one customer in the sales folder. Note that
        curl's -G with --data-urlencode does the encoding for you:

            curl -G https://api.invopop.com/silo/v1/entries/query -H "Authorization: Bearer $TOKEN" --data-urlencode 'schema=bill/invoice' --data-urlencode 'filter=customer_tax_code = "X3157928M" AND folder = "sales"'

        A tax code is stored without its country prefix, which is held separately
        as supplier_country or customer_country. Filter on "X3157928M", not on
        "ESX3157928M".

        Page through results by passing the previous response's "next_cursor" as
        "cursor". A cursor is only valid for the same schema, filter and
        order_by, and only in the workspace that produced it.

        ## Fields

        Fields available to `filter`, `order_by` and `fields`, for each of the 8 document types.

        **Indexed** means the field has a database index behind it. Several of those indexes also lead with `folder`, so a filter that names only the indexed field cannot always use one — if a response comes back with a note about index coverage, adding `folder` to the filter will usually resolve it. Filtering on a field with no index at all is still allowed, but runs under a shorter time limit.

        ### Common to every document type

        | Field | Type | Operators | Sortable | Indexed |
        | --- | --- | --- | --- | --- |
        | `id` | uuid | `=` `!=` `in` | yes | yes |
        | `rev` | string | *not filterable* | — | — |
        | `rev_num` | int | *not filterable* | — | — |
        | `folder` | key | `=` `!=` `in` | yes | yes |
        | `state` | key | `=` `!=` `in` | yes | yes |
        | `state_at` | timestamp | `=` `!=` `<` `<=` `>` `>=` `in` | yes | — |
        | `doc_schema` | string | `=` `!=` `in` | — | — |
        | `env_schema` | string | `=` `!=` `in` | — | — |
        | `entry_key` | string | `=` `!=` `in` | — | — |
        | `version` | string | `=` `!=` `in` | — | — |
        | `digest_alg` | string | *not filterable* | — | — |
        | `digest_val` | string | `=` `!=` `in` `starts_with` | — | — |
        | `tags` | strings | `:` | — | — |
        | `signed` | bool | `=` `!=` | yes | — |
        | `invalid` | bool | `=` `!=` | yes | — |
        | `relations_hash` | int | *not filterable* | — | — |
        | `files` | json | *not filterable* | — | — |
        | `faults` | json | *not filterable* | — | — |
        | `snippet` | json | *not filterable* | — | — |
        | `created_at` | timestamp | `=` `!=` `<` `<=` `>` `>=` `in` | yes | yes |
        | `updated_at` | timestamp | `=` `!=` `<` `<=` `>` `>=` `in` | yes | yes |
        | `synced_at` | timestamp | `=` `!=` `<` `<=` `>` `>=` `in` | yes | — |
        | `doc_uuid` | uuid | `=` `!=` `in` | — | — |
        | `related` | uuid | `:` | — | — |
        | `related.self` | uuid | `:` | — | — |

        > `folder` and `state` accept values defined by your own workspace: the folders you have created, and any custom states you have added to the built-in ones. Those values are workspace data rather than part of this schema, so they are not listed here.

