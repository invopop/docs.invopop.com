openapi: 3.0.0
info:
  contact:
    email: dev@invopop.com
    name: Invopop Developers
  description: Store and manage GOBL documents along with their attachments in "Silo
    Entries".
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Silo Service API
  version: 1.0.0
servers:
- description: production
  url: https://api.invopop.com
security:
- authToken: []
paths:
  /silo/v1/entries:
    get:
      description: Fetch all the silo entries in the current workspace.
      parameters:
      - description: The folder in which to search for entries.
        in: query
        name: folder
        schema:
          description: The folder in which to search for entries.
          example: invoices
          title: Folder
          type: string
      - description: Starting date and time for retrieving results, formatted as an
          ISO timestamp. Treated as the upper bound when descending (the default)
          or the lower bound when ascending.
        in: query
        name: created_at
        schema:
          description: Starting date and time for retrieving results, formatted as
            an ISO timestamp. Treated as the upper bound when descending (the default)
            or the lower bound when ascending.
          example: "2023-08-02T00:00:00.000Z"
          title: Created At
          type: string
      - description: The position marker from the previous result's next_cursor property,
          used for pagination. Must be used with the same ascending value as the call
          that produced it.
        in: query
        name: cursor
        schema:
          description: The position marker from the previous result's next_cursor
            property, used for pagination. Must be used with the same ascending value
            as the call that produced it.
          title: Cursor
          type: string
      - description: The maximum number of entries to return in a single page of results,
          up to 100.
        in: query
        name: limit
        schema:
          description: The maximum number of entries to return in a single page of
            results, up to 100.
          example: 20
          title: Limit
          type: integer
      - description: When true, results are returned in ascending order (oldest first)
          instead of the default descending order (newest first).
        in: query
        name: ascending
        schema:
          description: When true, results are returned in ascending order (oldest
            first) instead of the default descending order (newest first).
          title: Ascending
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloEntryCollection'
          description: OK
    post:
      description: Create a new silo entry without an explicit UUID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiloCreateEntry'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloEntry'
          description: OK
  /silo/v1/entries/{entry_id}/files:
    post:
      description: Add a new file to a silo entry without an explicit UUID. The file
        data can be provided inline as base64 encoded data, or omitted to create a
        placeholder. When data is not provided, you must provide sha256, size, and
        mime fields, then send the raw contents with a PUT to this file's `/data`
        path. For non enrolled users, only the `format` and `attachment` categories
        are allowed.
      parameters:
      - description: UUID of the silo entry.
        in: path
        name: entry_id
        required: true
        schema:
          description: UUID of the silo entry.
          title: Entry ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                category:
                  description: Category of the file.
                  example: format
                  title: Category
                  type: string
                data:
                  deprecated: true
                  description: 'Deprecated: provide sha256, size and mime instead,
                    then PUT the raw contents to this file''s /data path. Sending
                    data inline is limited to 5MB.'
                  format: byte
                  type: string
                desc:
                  description: Description of the file.
                  example: Invoice for January 2021.
                  title: Description
                  type: string
                embeddable:
                  description: When true, this file may be embedded inside other files,
                    like PDFs. Default is false.
                  example: true
                  title: Embeddable
                  type: boolean
                key:
                  description: Key used to identify the file in the entry.
                  example: pdf
                  title: Key
                  type: string
                meta:
                  additionalProperties:
                    type: string
                  description: Any additional meta data about the file.
                  title: Meta
                  type: object
                mime:
                  description: MIME type of the file. Required when data is not provided.
                  example: application/pdf
                  title: MIME
                  type: string
                name:
                  description: Name of the file.
                  example: invoice.pdf
                  title: Name
                  type: string
                private:
                  description: When true, this file is private and can only be accessed
                    by the owner. Default is false.
                  example: true
                  title: Private
                  type: boolean
                sha256:
                  description: SHA256 hex hash of the file. Required when data is
                    not provided.
                  example: 27a0b656df99dc32124b4c49f2f3c35025f0a7453f289cbaa0701435cfcf4e28
                  title: SHA256
                  type: string
                size:
                  description: Size of the file in bytes. Required when data is not
                    provided.
                  example: 12345
                  title: Size
                  type: integer
              required:
              - name
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloFile'
          description: OK
  /silo/v1/entries/{entry_id}/files/{id}:
    get:
      description: Download silo entry file's data. Content type and disposition will
        be set according to the source.
      parameters:
      - description: UUID of the file to fetch, may be a previous version.
        in: path
        name: id
        required: true
        schema:
          description: UUID of the file to fetch, may be a previous version.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      - description: UUID of the silo entry.
        in: path
        name: entry_id
        required: true
        schema:
          description: UUID of the silo entry.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: Entry ID
          type: string
      responses:
        "200":
          description: Contains the file data.
    put:
      description: Add a new file to a silo entry with a specific UUID. The file data
        can be provided inline as base64 encoded data, or omitted to create a placeholder.
        When data is not provided, you must provide sha256, size, and mime fields,
        then send the raw contents with a PUT to this file's `/data` path. For non
        enrolled users, only the `format` and `attachment` categories are allowed.
      parameters:
      - description: UUID of file to create
        in: path
        name: id
        required: true
        schema:
          description: UUID of file to create
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      - description: UUID of the silo entry.
        in: path
        name: entry_id
        required: true
        schema:
          description: UUID of the silo entry.
          title: Entry ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                category:
                  description: Category of the file.
                  example: format
                  title: Category
                  type: string
                data:
                  deprecated: true
                  description: 'Deprecated: provide sha256, size and mime instead,
                    then PUT the raw contents to this file''s /data path. Sending
                    data inline is limited to 5MB.'
                  format: byte
                  type: string
                desc:
                  description: Description of the file.
                  example: Invoice for January 2021.
                  title: Description
                  type: string
                embeddable:
                  description: When true, this file may be embedded inside other files,
                    like PDFs. Default is false.
                  example: true
                  title: Embeddable
                  type: boolean
                key:
                  description: Key used to identify the file in the entry.
                  example: pdf
                  title: Key
                  type: string
                meta:
                  additionalProperties:
                    type: string
                  description: Any additional meta data about the file.
                  title: Meta
                  type: object
                mime:
                  description: MIME type of the file. Required when data is not provided.
                  example: application/pdf
                  title: MIME
                  type: string
                name:
                  description: Name of the file.
                  example: invoice.pdf
                  title: Name
                  type: string
                private:
                  description: When true, this file is private and can only be accessed
                    by the owner. Default is false.
                  example: true
                  title: Private
                  type: boolean
                sha256:
                  description: SHA256 hex hash of the file. Required when data is
                    not provided.
                  example: 27a0b656df99dc32124b4c49f2f3c35025f0a7453f289cbaa0701435cfcf4e28
                  title: SHA256
                  type: string
                size:
                  description: Size of the file in bytes. Required when data is not
                    provided.
                  example: 12345
                  title: Size
                  type: integer
              required:
              - name
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloFile'
          description: OK
  /silo/v1/entries/{entry_id}/files/{id}/data:
    put:
      description: Upload a file's contents as a raw stream. Register the file first
        with sha256, size and mime and no data, then PUT the bytes here. They are
        checked against the registered sha256 and size before being stored, and a
        mismatch is rejected. Files up to 100MB are accepted. This is the only way
        to send files larger than 5MB.
      parameters:
      - description: UUID of the file whose data is being uploaded
        in: path
        name: id
        required: true
        schema:
          description: UUID of the file whose data is being uploaded
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      - description: UUID of the silo entry.
        in: path
        name: entry_id
        required: true
        schema:
          description: UUID of the silo entry.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: Entry ID
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        description: Raw file contents.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloFile'
          description: OK
  /silo/v1/entries/{entry_id}/states:
    get:
      description: Fetch the current and previous state objects for a silo entry.
      parameters:
      - description: UUID of the entry to find states for.
        in: path
        name: entry_id
        required: true
        schema:
          description: UUID of the entry to find states for.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: Entry ID
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloStateCollection'
          description: OK
    post:
      description: Create a new state for a silo entry without time
      parameters:
      - description: UUID of the entry to create state for
        in: path
        name: entry_id
        required: true
        schema:
          description: UUID of the entry to create state for
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: Entry ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiloCreateState'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloState'
          description: OK
  /silo/v1/entries/{entry_id}/states/{at}:
    put:
      description: Create a new state for a silo entry
      parameters:
      - description: ISO timestamp with millisecond accuracy.
        in: path
        name: at
        required: true
        schema:
          description: ISO timestamp with millisecond accuracy.
          example: "2023-08-02T00:00:00.000Z"
          title: Timestamp
          type: string
      - description: UUID of the entry to create state for
        in: path
        name: entry_id
        required: true
        schema:
          description: UUID of the entry to create state for
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: Entry ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                key:
                  description: Key for the state.
                  example: paid
                  title: Key
                  type: string
                meta:
                  additionalProperties:
                    type: string
                  description: Any additional structured fields about the state.
                  title: Meta
                  type: object
                notes:
                  description: Additional details.
                  title: Notes
                  type: string
              required:
              - key
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloState'
          description: OK
  /silo/v1/entries/{id}:
    get:
      description: Fetch an existing silo entry given its UUID.
      parameters:
      - description: UUID of the silo entry to fetch.
        in: path
        name: id
        required: true
        schema:
          description: UUID of the silo entry to fetch.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloEntry'
          description: OK
    patch:
      description: Update an existing silo entry given its UUID.
      parameters:
      - description: UUID of the silo entry to update.
        in: path
        name: id
        required: true
        schema:
          description: UUID of the silo entry to update.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiloUpdateEntry'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloEntry'
          description: OK
    put:
      description: Create a new silo entry with the given UUID.
      parameters:
      - description: UUID of the silo entry to create.
        in: path
        name: id
        required: true
        schema:
          description: UUID of the silo entry to create.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                allow_invalid:
                  description: When true, the envelope's contents are allowed to be
                    invalid.
                  example: true
                  title: Allow Invalid
                  type: boolean
                content_type:
                  description: The content type of the data being uploaded.
                  example: application/json
                  title: Content Type
                  type: string
                correct:
                  description: JSON object containing the GOBL correction option data.
                  example:
                    type: credit-note
                  title: Correct
                  type: object
                data:
                  description: Data contents to upload which may either be a GOBL
                    Envelope or Object. Any partial data will be calculated and validated
                    automatically.
                  title: Data
                  type: object
                folder:
                  description: In which folder the entry should be associated, leave
                    empty to use the automatic rules.
                  title: Folder
                  type: string
                key:
                  description: Key used to identify the entry idempotently within
                    a workspace.
                  example: invoice-101
                  title: Key
                  type: string
                previous_id:
                  description: The UUID of the previous silo entry to copy.
                  format: uuid
                  title: Previous ID
                  type: string
                sign:
                  description: When true, the GOBL envelope will be signed automatically.
                  example: false
                  title: Sign
                  type: boolean
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloEntry'
          description: OK
  /silo/v1/entries/{id}/export:
    get:
      description: |-
        Convert a silo entry's GOBL envelope into an external format, such as UBL or CII,
        optionally embedding the entry's files. Nothing is stored: use the "silo.export"
        workflow action to keep the result as one of the entry's files. The response is the
        converted document as a raw download, with the key of the format used in the
        "GOBL-Convert-Format" header.
      parameters:
      - description: 'Key of the format to export to, as listed by /gobl/convert/formats.
          Repeat the parameter, or separate keys with commas, to offer several in
          order of preference: the first that accepts the document is used.'
        in: query
        name: format
        required: true
        schema:
          description: 'Key of the format to export to, as listed by /gobl/convert/formats.
            Repeat the parameter, or separate keys with commas, to offer several in
            order of preference: the first that accepts the document is used.'
          example:
          - ubl+peppol+bis-v3
          items:
            type: string
          title: Format
          type: array
      - description: Category of the entry's files to embed in the exported document.
          None are embedded when omitted.
        in: query
        name: attachments
        schema:
          description: Category of the entry's files to embed in the exported document.
            None are embedded when omitted.
          enum:
          - all
          - format
          - attachment
          title: Attachments
          type: string
      - description: Only embed files of these MIME types, any when omitted.
        in: query
        name: mime
        schema:
          description: Only embed files of these MIME types, any when omitted.
          example:
          - application/pdf
          items:
            type: string
          title: MIME
          type: array
      - description: UUID of the silo entry to export.
        in: path
        name: id
        required: true
        schema:
          description: UUID of the silo entry to export.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The exported document. Content type and disposition are set
            according to the format.
  /silo/v1/entries/{id}/import:
    put:
      description: |-
        Create a new silo entry from a document in an external format, such as UBL or CII,
        sent as the raw request body; its format is detected automatically. An existing entry
        is never updated. The original document is kept as one of the entry's files with the
        "format" category, and any files embedded in it with the "attachment" category.
        Requests up to 100MB are accepted.
      parameters:
      - description: 'Key used to identify the entry idempotently within a workspace:
          repeating an import with the same key provides the entry already created.'
        in: query
        name: key
        schema:
          description: 'Key used to identify the entry idempotently within a workspace:
            repeating an import with the same key provides the entry already created.'
          example: invoice-101
          title: Key
          type: string
      - description: In which folder the entry should be associated, leave empty to
          use the automatic rules.
        in: query
        name: folder
        schema:
          description: In which folder the entry should be associated, leave empty
            to use the automatic rules.
          title: Folder
          type: string
      - description: Keys of the formats to limit detection to. When omitted, the
          format is detected from the document.
        in: query
        name: format
        schema:
          description: Keys of the formats to limit detection to. When omitted, the
            format is detected from the document.
          example:
          - ubl+peppol+bis-v3
          items:
            type: string
          title: Format
          type: array
      - description: File name of the original document, kept with the entry's file.
        in: query
        name: name
        schema:
          description: File name of the original document, kept with the entry's file.
          example: invoice.xml
          title: Name
          type: string
      - description: When true, the envelope's contents are allowed to be invalid.
        in: query
        name: allow_invalid
        schema:
          description: When true, the envelope's contents are allowed to be invalid.
          example: true
          title: Allow Invalid
          type: boolean
      - description: When true, the GOBL envelope will be signed automatically.
        in: query
        name: sign
        schema:
          description: When true, the GOBL envelope will be signed automatically.
          example: false
          title: Sign
          type: boolean
      - description: When true, the entry's files are stored as private, and attachments
          are not linked from the document.
        in: query
        name: private
        schema:
          description: When true, the entry's files are stored as private, and attachments
            are not linked from the document.
          example: false
          title: Private
          type: boolean
      - description: UUID of the silo entry to create.
        in: path
        name: id
        required: true
        schema:
          description: UUID of the silo entry to create.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        description: Raw document to import.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloEntry'
          description: OK
  /silo/v1/entries/{id}/related:
    get:
      description: Find silo entries whose document mentions the given entry's UUID.
      parameters:
      - description: The unique identifier of the document to find related entries
          for.
        in: query
        name: uuid
        schema:
          description: The unique identifier of the document to find related entries
            for.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: UUID
          type: string
      - description: The specific context within a document where the silo entry's
          UUID is referenced.
        in: query
        name: context
        schema:
          description: The specific context within a document where the silo entry's
            UUID is referenced.
          example: line.item
          title: Context
          type: string
      - description: The starting date and time for retrieving related entries in
          descending order, formatted as an ISO timestamp.
        in: query
        name: created_at
        schema:
          description: The starting date and time for retrieving related entries in
            descending order, formatted as an ISO timestamp.
          example: "2023-08-02T00:00:00.000Z"
          title: Created At
          type: string
      - description: The position marker from the previous result's next_cursor property,
          used for pagination.
        in: query
        name: cursor
        schema:
          description: The position marker from the previous result's next_cursor
            property, used for pagination.
          title: Cursor
          type: string
      - description: The maximum number of related entries to return in a single page
          of results.
        in: query
        name: limit
        schema:
          description: The maximum number of related entries to return in a single
            page of results.
          example: 20
          title: Limit
          type: integer
      - description: Silo entry ID to find related entries for.
        in: path
        name: id
        required: true
        schema:
          description: Silo entry ID to find related entries for.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloEntryCollection'
          description: OK
  /silo/v1/entries/{id}/versions/{version}:
    get:
      description: Fetch a specific version of a silo entry's envelope data.
      parameters:
      - description: UUID of the silo entry to fetch.
        in: path
        name: id
        required: true
        schema:
          description: UUID of the silo entry to fetch.
          example: 347c5b04-cde2-11ed-afa1-0242ac120002
          title: ID
          type: string
      - description: Version of the envelope data to fetch.
        in: path
        name: version
        required: true
        schema:
          description: Version of the envelope data to fetch.
          example: 76f845c125
          title: Version
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloEntryData'
          description: OK
  /silo/v1/entries/import:
    post:
      description: |-
        Create a new silo entry from a document in an external format, such as UBL or CII,
        sent as the raw request body; its format is detected automatically. An existing entry
        is never updated. The original document is kept as one of the entry's files with the
        "format" category, and any files embedded in it with the "attachment" category.
        Requests up to 100MB are accepted.
      parameters:
      - description: 'Key used to identify the entry idempotently within a workspace:
          repeating an import with the same key provides the entry already created.'
        in: query
        name: key
        schema:
          description: 'Key used to identify the entry idempotently within a workspace:
            repeating an import with the same key provides the entry already created.'
          example: invoice-101
          title: Key
          type: string
      - description: In which folder the entry should be associated, leave empty to
          use the automatic rules.
        in: query
        name: folder
        schema:
          description: In which folder the entry should be associated, leave empty
            to use the automatic rules.
          title: Folder
          type: string
      - description: Keys of the formats to limit detection to. When omitted, the
          format is detected from the document.
        in: query
        name: format
        schema:
          description: Keys of the formats to limit detection to. When omitted, the
            format is detected from the document.
          example:
          - ubl+peppol+bis-v3
          items:
            type: string
          title: Format
          type: array
      - description: File name of the original document, kept with the entry's file.
        in: query
        name: name
        schema:
          description: File name of the original document, kept with the entry's file.
          example: invoice.xml
          title: Name
          type: string
      - description: When true, the envelope's contents are allowed to be invalid.
        in: query
        name: allow_invalid
        schema:
