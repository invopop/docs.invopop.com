        in: query
        name: filter
        schema:
          description: Filter expression, as used when listing entries.
          example: state = "sent"
          title: Filter
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiloEntryCount'
          description: OK
